{% extends "base.html" %}
{% block content %}
<style>
    .wl-kicker {
        font-size: 0.68em; letter-spacing: 0.22em; text-transform: uppercase; font-weight: 800;
        color: var(--accent); opacity: 0.9; margin: 0 0 6px;
    }
    .wl-hero {
        position: relative; overflow: hidden; border-radius: 18px; padding: 28px 24px 24px;
        margin-bottom: 22px; text-align: left;
        background:
            radial-gradient(ellipse at 16% 0%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 52%),
            linear-gradient(180deg, color-mix(in srgb, var(--bg-box) 90%, #000), var(--bg-box));
        border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 16px 40px rgba(0,0,0,0.35);
    }
    .wl-hero h1 { margin: 0 0 8px; }

    .wl-desk {
        max-width: 760px; margin: 0 auto; text-align: left;
        background:
            linear-gradient(180deg, color-mix(in srgb, var(--bg-box) 92%, #000), var(--bg-box));
        border: 1px solid color-mix(in srgb, var(--accent) 32%, transparent);
        box-shadow: 0 16px 36px rgba(0,0,0,0.35);
        position: relative;
        padding: 28px 26px 26px;
    }
    .wl-desk::before {
        content: ''; position: absolute; inset: 0 0 auto; height: 3px;
        background: var(--accent); box-shadow: 0 0 16px var(--accent);
    }
    .wl-desk input, .wl-desk select, .wl-desk textarea { width: 100%; box-sizing: border-box; }
    .wl-desk textarea {
        min-height: 88px; resize: vertical; padding: 12px 14px;
        border-radius: var(--radius-sm);
        border: 1px solid color-mix(in srgb, var(--accent) 38%, transparent);
        background: var(--input-bg); color: var(--text-main);
        font-size: 16px; font-family: inherit;
    }
    .wl-desk select {
        padding: 12px 14px; font-size: 16px; font-weight: 700;
    }
    .wl-desk .btn-full {
        font-weight: 900;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        margin-top: 6px;
        padding: 13px 16px;
    }
</style>

<div class="wl-hero">
    <div class="page-header" style="margin: 0;">
        <p class="wl-kicker" data-i18n="wishlist.kicker">{{ t('wishlist.kicker') }}</p>
        <h1>💡 <span data-i18n="wishlist.title">{{ t('wishlist.title') }}</span></h1>
        <p class="page-sub" data-i18n="wishlist.sub">{{ t('wishlist.sub') }}</p>
    </div>
</div>

<div class="box wl-desk">
    <p class="wl-kicker" data-i18n="wishlist.transmit">{{ t('wishlist.transmit') }}</p>
    <h2 style="margin-top:0;" data-i18n="wishlist.drop">{{ t('wishlist.drop') }}</h2>
    {% if success %}
    <div class="alert-ok">
        ✅ <span data-i18n="wishlist.sent">{{ t('wishlist.sent') }}</span>
    </div>
    {% endif %}
    <form method="POST" class="form-stack">
        <div>
            <label class="form-label" data-i18n="wishlist.type">{{ t('wishlist.type') }}</label>
            <select name="kind" id="wl-kind" required>
                <option value="game" data-i18n="wishlist.game">{{ t('wishlist.game') }}</option>
                <option value="banner" data-i18n="wishlist.banner">{{ t('wishlist.banner') }}</option>
                <option value="frame" data-i18n="wishlist.frame">{{ t('wishlist.frame') }}</option>
                <option value="other" data-i18n="wishlist.other">{{ t('wishlist.other') }}</option>
            </select>
        </div>
        <div>
            <label class="form-label" data-i18n="wishlist.yourRequest">{{ t('wishlist.yourRequest') }}</label>
            <textarea name="message" id="wl-message" required maxlength="500" data-i18n-placeholder="wishlist.hintGame" placeholder="{{ t('wishlist.hintGame') }}"></textarea>
        </div>
        <button type="submit" class="btn-full">🚀 <span data-i18n="wishlist.send">{{ t('wishlist.send') }}</span></button>
    </form>
</div>
<script>
    function wlT(key) {
        return (window.OTI18n && typeof window.OTI18n.t === 'function') ? window.OTI18n.t(key) : key;
    }
    const kindEl = document.getElementById('wl-kind');
    const msgEl = document.getElementById('wl-message');
    function syncWlHint() {
        if (!kindEl || !msgEl) return;
        const map = {
            game: 'wishlist.hintGame',
            banner: 'wishlist.hintBanner',
            frame: 'wishlist.hintFrame',
            other: 'wishlist.hintOther'
        };
        msgEl.placeholder = wlT(map[kindEl.value] || 'wishlist.hintOther');
        msgEl.setAttribute('data-i18n-placeholder', map[kindEl.value] || 'wishlist.hintOther');
    }
    if (kindEl) kindEl.addEventListener('change', syncWlHint);
    document.addEventListener('ot-lang-change', syncWlHint);
    syncWlHint();
</script>
{% endblock %}
